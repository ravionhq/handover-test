name: bench-warm cache
on:
  workflow_dispatch:
    inputs:
      tag:
        required: false
        default: "x"
        type: string
jobs:
  bench:
    runs-on: ravion/ee=devin-nvme-m8id-4xl/type=sandbox/cpu=2/memory=4/disk_cache=auto
    steps:
      - run: "true"
      - uses: actions/checkout@v4
      - run: mkdir -p ~/warm && date >> ~/warm/stamp && wc -l ~/warm/stamp && ls
