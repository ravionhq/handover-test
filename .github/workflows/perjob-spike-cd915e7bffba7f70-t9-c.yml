name: per-job T9 matrix
on:
  workflow_dispatch:
jobs:
  spike:
    name: T9 leg ${{ matrix.n }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    runs-on: ravion-spike/t9/id=${{ github.run_id }}-leg-${{ matrix.n }}
    steps:
      - run: sleep 60
