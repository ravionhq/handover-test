name: Per-job T8 shared-label matrix 322007be2bd6c580
on:
  workflow_dispatch:
    inputs:
      label:
        required: true
        type: string
      sleep_seconds:
        required: false
        default: "10"
        type: string
jobs:
  spike:
    name: spike (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3]
    runs-on: ${{ inputs.label }}
    steps:
      - run: sleep "${{ inputs.sleep_seconds }}"
