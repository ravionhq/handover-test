name: bench-parked-checkout
run-name: bench-parked-checkout ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        required: false
        default: ""
jobs:
  parked:
    runs-on: ravion/ee=ee_3KX1V773NYCtQfuFLdc7vF95M3x/type=sandbox/cpu=2/memory=4/disk=20/disk_cache=auto/id=${{ github.run_id }}-${{ github.run_attempt }}-parkedco
    steps:
      - run: "true"
      - uses: actions/checkout@v4
      - run: mkdir -p ~/work-cache && date >> ~/work-cache/stamp && du -sh ~/work-cache
